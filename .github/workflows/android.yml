name: Build & test CUTTINX
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
        # the legacy "tools" package (default) no longer exists in the SDK repository
        with: { packages: 'platform-tools' }
      - name: Shader validator
        run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - name: Unit tests (core + engine)
        run: ./gradlew :core:test :app:testDebugUnitTest --no-daemon
      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon
      - name: Build APK
        run: ./gradlew :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: cuttinx-apk
          path: app/build/outputs/apk/release/app-release.apk
