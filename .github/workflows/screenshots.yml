name: Captures de l'appli (émulateur)
# Real screenshots and screen recordings of CUTTINX for the promo videos: an Android emulator
# installs the app and tools/screenshots/run.sh drives it (camera, takes, editor, filters…).
on:
  workflow_dispatch:
  push:
    paths: ['tools/screenshots/**', '.github/workflows/screenshots.yml']
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools' }
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run CUTTINX on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene -camera-front emulated
          script: APK=app/build/outputs/apk/debug/app-debug.apk OUT=shots bash tools/screenshots/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuttinx-captures
          path: shots
